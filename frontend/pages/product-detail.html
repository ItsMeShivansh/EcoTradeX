<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — Eco TradeX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/navigation.css"><link rel="stylesheet" href="../css/footer.css"><link rel="stylesheet" href="../css/hero.css"><link rel="stylesheet" href="../css/products.css"><link rel="stylesheet" href="../css/sections.css"><link rel="stylesheet" href="../css/whatsapp.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="shared-navbar"></div>
<main class="section" id="product-detail-content"><div class="container">
  <div class="product-detail">
    <div class="product-detail__gallery">
      <div class="product-detail__main-image" id="product-main-image" style="display:flex;align-items:center;justify-content:center;background:var(--color-bg-tertiary);">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--color-slate-300)" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </div>
      <div style="margin-top:var(--space-4);"><a href="private-label.html" class="btn btn-outline-green w-full"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Get Custom Printing Quote</a></div>
    </div>
    <div class="product-detail__info">
      <div id="detail-header"><p class="text-secondary">Loading product details...</p></div>
      <div class="spec-section">
        <div class="spec-section__header"><div class="spec-section__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></div><h3 class="spec-section__title">Technical Specifications</h3></div>
        <div class="spec-section__body" id="tech-specs"></div>
      </div>
      <div class="spec-section">
        <div class="spec-section__header"><div class="spec-section__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div><h3 class="spec-section__title">Export Readiness Data</h3></div>
        <div class="spec-section__body" style="padding:var(--space-5);" id="export-data"></div>
      </div>
      <div><h3 style="font-family:var(--font-heading);font-size:var(--fs-2xl);font-weight:var(--fw-semibold);margin-bottom:var(--space-6);">Pricing Tiers</h3><div class="pricing-grid" id="pricing-tiers"></div></div>
    </div>
  </div>
</div></main>
<div class="modal-backdrop" id="quote-modal-backdrop" onclick="closeModal('quote-modal')"></div>
<div class="modal" id="quote-modal">
  <div class="modal__header"><h3 class="modal__title">Request Custom Quote</h3><button class="modal__close" onclick="closeModal('quote-modal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <form id="quote-form" class="flex-col gap-4">
    <div class="form-group"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-input" required></div>
    <div class="form-group"><label class="form-label">Company *</label><input type="text" name="company" class="form-input" required></div>
    <div class="form-group"><label class="form-label">Email *</label><input type="email" name="email" class="form-input" required></div>
    <div class="form-group"><label class="form-label">Country</label><select name="country" class="form-select"><option value="">Select</option><option>UAE</option><option>United Kingdom</option><option>Saudi Arabia</option><option>Other</option></select></div>
    <div class="form-group"><label class="form-label">Quantity</label><input type="text" name="quantity" class="form-input" placeholder="e.g., 10,000 units"></div>
    <div class="form-group"><label class="form-label">Details</label><textarea name="details" class="form-textarea"></textarea></div>
    <button type="submit" class="btn btn-primary w-full">Submit Quote Request</button>
  </form>
</div>
<div id="shared-footer"></div>
<div id="shared-whatsapp"></div>
<script src="../js/main.js"></script><script src="../js/components.js"></script><script src="../js/products.js"></script><script src="../js/whatsapp.js"></script><script src="../js/forms.js"></script><script src="../js/animations.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await injectSharedComponents('products');
  renderProductDetail();
});
</script>
</body>
</html>
