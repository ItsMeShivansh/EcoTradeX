<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compostable Bags — Eco TradeX</title>
  <meta name="description" content="Compostable carry bags, garbage liners, and courier mailers for export. CPCB & EN 13432 certified.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div id="shared-whatsapp"></div>
